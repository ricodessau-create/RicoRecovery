name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet restore RicoRecovery.slnx
      - run: dotnet test tests/RicoRecovery.Tests/RicoRecovery.Tests.csproj -c Release --no-restore
